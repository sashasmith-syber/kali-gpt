# =============================================================================
# .github/dependabot.yml — Hardened Dependabot configuration
# Follows GitHub/GitLab 2026 supply-chain security best practices:
#   • Daily security-only updates for production ecosystems
#   • Weekly full updates (dev deps, GH Actions) on separate schedule
#   • Scoped to all manifest locations in the monorepo
#   • Open count limited to avoid PR flood; security PRs always opened
#   • Labels for triage; assignee set so nothing is ignored
#   • commit-message prefix keeps changelog clean
# =============================================================================

version: 2

updates:
  # ── Python backend (FastAPI / pip) ─────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      python-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    assignees:
      - "sashasmith-syber"
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ── desktop-defender (Electron + Vite) ─────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/desktop-defender"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      electron-minor:
        patterns: ["electron", "vite", "@vitejs/*"]
        update-types: ["minor", "patch"]
      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]
    assignees:
      - "sashasmith-syber"
    labels:
      - "dependencies"
      - "npm"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]

  # ── Net-Reaper / app frontend ───────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/Net-Reaper-Claude Integration Architecture/app"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    assignees:
      - "sashasmith-syber"
    labels:
      - "dependencies"
      - "npm"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ── backend/frontend (nested) ───────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/backend/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    assignees:
      - "sashasmith-syber"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    assignees:
      - "sashasmith-syber"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
